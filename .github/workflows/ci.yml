# CI for VCam Blender (IMPLEMENTATION_PLAN.md tasks 0.1.5, 1.3.5; SRS XP-001/002, NFR-QA-002).
# Rust checks -> vcam_native wheels per OS -> Blender extension (split per platform)
# -> headless Blender smoke + fake-iPhone integration tests per OS. Plus Python and iOS unit tests.
name: CI

# Runs on PRs once they're ready (drafts skip every job) and on demand. Every change reaches
# main through a PR that passed ci-ok, so there's no separate push run on main.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BLENDER_VERSION: "5.2.2"
  BLENDER_SERIES: "5.2"
  PYTHON_VERSION: "3.13" # Blender 5.2's bundled Python
  MATURIN_VERSION: "v1.15.0"
  CARGO_TERM_COLOR: always

jobs:
  rust-fmt:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: cargo fmt --check
        working-directory: native
        run: cargo fmt --check

  rust:
    if: github.event.pull_request.draft != true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7 # pyo3's build script needs an interpreter
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target.nosync
      # turbojpeg-sys (vcam-video dev-dependency) builds libjpeg-turbo's x86-64 SIMD with NASM.
      - name: Install NASM (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nasm
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: cargo clippy
        working-directory: native
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: native
        run: cargo test

  fuzz:
    if: github.event.pull_request.draft != true
    # PR-005 / NFR-QA-002: time-boxed cargo-fuzz run per target, seeded from testdata/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Seed corpora from testdata/
        working-directory: native/fuzz
        run: |
          mkdir -p corpus/udp_open corpus/control_decode corpus/pairing_inputs
          for f in ../../testdata/vcp/*.bin; do
            case "$(basename "$f")" in
              hello_pair.bin|error_not_paired.bin) cp "$f" corpus/control_decode/ ;;
              *) cp "$f" corpus/udp_open/ ;;
            esac
          done
          python3 - <<'EOF'
          import json
          for name, keys in (("session", ["HELLO", "SESSION_CHALLENGE", "SESSION_PROOF", "SESSION_ACCEPT"]),
                             ("pairing", ["HELLO", "PAIR_CHALLENGE", "PAIR_PROOF", "PAIR_ACCEPT"])):
              msgs = json.load(open(f"../../testdata/vcp/{name}.json"))["messages"]
              for key in keys:
                  open(f"corpus/control_decode/{name}_{key}.bin", "wb").write(bytes.fromhex(msgs[key]))
          pairing = json.load(open("../../testdata/vcp/pairing.json"))["messages"]
          open("corpus/pairing_inputs/proof.bin", "wb").write(b"\x00" + bytes.fromhex(pairing["PAIR_PROOF"])[12:])
          open("corpus/pairing_inputs/challenge.bin", "wb").write(b"\x01" + bytes.fromhex(pairing["PAIR_CHALLENGE"])[12:] + bytes(32))
          EOF
      - name: cargo fuzz run (60 s per target)
        working-directory: native
        run: |
          for target in udp_open control_decode pairing_inputs; do
            cargo +nightly fuzz run "$target" -- -max_total_time=60 -rss_limit_mb=2048
          done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts
          path: native/fuzz/artifacts/

  wheels:
    if: github.event.pull_request.draft != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            manylinux: "2_28"
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: maturin build
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          manylinux: ${{ matrix.manylinux }}
          # Inside the Linux manylinux container, python3.13 is on PATH; elsewhere use setup-python's.
          args: >-
            --release -m native/vcam-py/Cargo.toml -o dist
            -i ${{ runner.os == 'Linux' && 'python3.13' || steps.python.outputs.python-path }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ runner.os }}
          path: dist/*.whl
          if-no-files-found: error

  extension:
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: BlenderAddOn/wheels
          merge-multiple: true
      - name: List every wheel in the manifest
        run: python3 tools/set_manifest_wheels.py BlenderAddOn/blender_manifest.toml BlenderAddOn/wheels
      - name: Install Blender
        run: |
          curl -fsSL -o blender.tar.xz "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          tar -xf blender.tar.xz
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1
      - name: blender --command extension build --split-platforms
        run: |
          mkdir -p dist
          "blender-${BLENDER_VERSION}-linux-x64/blender" --command extension build \
            --split-platforms --source-dir BlenderAddOn --output-dir dist
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: dist/*.zip
          if-no-files-found: error

  blender-smoke:
    needs: extension
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux_x64
          - os: windows-latest
            platform: windows_x64
          - os: macos-latest
            platform: macos_arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target.nosync
      - name: Build the fake iPhone (task 1.2.7) for the integration tests
        working-directory: native
        run: |
          cargo build --release --locked -p vcam-fake-iphone
          exe=""; [ "${RUNNER_OS}" = "Windows" ] && exe=".exe"
          echo "FAKE_IPHONE=${GITHUB_WORKSPACE}/native/target.nosync/release/vcam-fake-iphone${exe}" >> "${GITHUB_ENV}"
      - uses: actions/download-artifact@v8
        with:
          name: extension
          path: dist
      - name: Install Blender
        run: |
          base="https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}"
          case "${RUNNER_OS}" in
            Linux)
              curl -fsSL -o blender.tar.xz "${base}-linux-x64.tar.xz"
              tar -xf blender.tar.xz
              sudo apt-get update && sudo apt-get install -y --no-install-recommends \
                libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1
              echo "BLENDER=${PWD}/blender-${BLENDER_VERSION}-linux-x64/blender" >> "${GITHUB_ENV}"
              ;;
            Windows)
              curl -fsSL -o blender.zip "${base}-windows-x64.zip"
              unzip -q blender.zip
              echo "BLENDER=${PWD}/blender-${BLENDER_VERSION}-windows-x64/blender.exe" >> "${GITHUB_ENV}"
              ;;
            macOS)
              curl -fsSL -o blender.dmg "${base}-macos-arm64.dmg"
              hdiutil attach -nobrowse -quiet -mountpoint /Volumes/Blender blender.dmg
              echo "BLENDER=/Volumes/Blender/Blender.app/Contents/MacOS/Blender" >> "${GITHUB_ENV}"
              ;;
          esac
      - name: Install the extension, import vcam_native, exercise Session
        env:
          BLENDER_USER_RESOURCES: ${{ runner.temp }}/blender-user
        run: |
          zip=$(ls dist/vcam_blender-*-${{ matrix.platform }}.zip)
          "${BLENDER}" --command extension install-file -r user_default -e "${zip}"
          "${BLENDER}" --background --factory-startup --python-exit-code 1 \
            --python tests/blender/smoke_native.py
          "${BLENDER}" --background --factory-startup --python-exit-code 1 \
            --python tests/blender/session_native.py
          "${BLENDER}" --background --factory-startup --python-exit-code 1 \
            --python tests/blender/addon_session.py
      - name: Integration tests with the fake iPhone (XP-002, task 1.3.5)
        env:
          BLENDER_USER_RESOURCES: ${{ runner.temp }}/blender-user
        run: |
          # addon_apply: matrix_world of the driven camera at every scripted keypose.
          # pose_leg_latency: the NFR-LAT-001 report over loopback (task 1.5.1).
          for t in addon_apply addon_panel addon_robust pose_leg_latency; do
            echo "::group::${t}"
            "${BLENDER}" --background --factory-startup --python-exit-code 1 \
              --python "tests/blender/${t}.py"
            echo "::endgroup::"
          done

  python:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest -q -p no:cacheprovider BlenderAddOn/tests
      - name: Golden vectors are up to date (testdata/ matches tools/gen_testdata.py)
        run: python tools/gen_testdata.py --check

  ios:
    if: github.event.pull_request.draft != true
    runs-on: xcode-27  # GitHub preview image: macOS 27, Xcode 27.0 default (matches local builds)
    steps:
      - uses: actions/checkout@v7
      - name: xcodebuild test (unit tests; ARKit can't run in the simulator)
        run: |
          xcodebuild test -project SightlineIOS/SightlineIOS.xcodeproj -scheme SightlineIOS \
            -destination 'platform=iOS Simulator,name=iPhone 17' -resultBundlePath xcresult/debug
      - name: Pose send path allocates nothing (NFR-LAT-002; needs optimised code)
        run: |
          xcodebuild test -configuration Release -project SightlineIOS/SightlineIOS.xcodeproj -scheme SightlineIOS \
            -destination 'platform=iOS Simulator,name=iPhone 17' -resultBundlePath xcresult/release \
            -only-testing:SightlineIOSTests/TrackingPipelineTests/testPoseSendPathAllocatesNothing
      # Crash logs of a test process that died live only in the result bundle.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ios-xcresult
          path: xcresult/

  ci-ok:
    # The single required check on main (branch protection). It fails unless every job ran and
    # passed, so a draft (all jobs skipped) can't satisfy it and trigger auto-merge early.
    if: always()
    needs: [rust-fmt, rust, fuzz, wheels, extension, blender-smoke, python, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "${r}" != success ]; then
              echo "::error::Not every job passed (drafts skip CI: mark the PR ready to run it)"
              exit 1
            fi
          done
