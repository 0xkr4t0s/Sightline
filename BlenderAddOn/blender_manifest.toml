schema_version = "1.0.0"

id = "vcam_blender"
version = "0.1.0"
name = "Sightline"
tagline = "Open-source iPhone virtual camera with a live viewfinder"
maintainer = "Sightline contributors"
type = "add-on"
blender_version_min = "5.2.0"

license = ["SPDX:GPL-3.0-or-later"]

tags = ["Camera", "Animation", "Import-Export"]

# Rust native module `vcam_native` (native/vcam-py), built by maturin. CI (task 0.1.5)
# adds the Windows and Linux wheels and platforms.
platforms = ["macos-arm64"]
wheels = ["./wheels/vcam_native-0.1.0-cp313-cp313-macosx_11_0_arm64.whl"]

[permissions]
network = "Pair with the Sightline iPhone app and receive camera tracking"
